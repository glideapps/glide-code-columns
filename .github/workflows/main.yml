name: Build & Deploy

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: npm i
      - name: Build
        run: npm run export
      - name: Archive Build
        uses: actions/upload-artifact@master
        with:
          name: public
          path: public
